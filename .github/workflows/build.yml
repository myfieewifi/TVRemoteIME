name: Build APK (Multi-ABI)

on:
  push:
    tags:
      - 'v*'           # 推送 v* 标签时自动触发构建并发布 Release
  workflow_dispatch:   # 支持在 Actions 页面手动触发

jobs:
  build:
    name: Build Android APK
    # 锁死 Ubuntu 版本，避免 2026-10-19 自动迁移到 Ubuntu 26 带来的不确定性
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # 升级到 v5，消除 Node.js 20 / setup-java v4 的弃用警告
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: "Build Release APK (ABI split: armeabi-v7a / arm64-v8a / universal)"
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 按 ABI 分包后 assembleRelease 会产出多个 APK，
      # 这里逐个收集并按「TVRemoteIME-<tag>-<abi>.apk」统一命名
      - name: Collect APKs
        id: collect
        run: |
          set -e
          mkdir -p out
          TAG="${GITHUB_REF_NAME:-debug}"
          count=0
          for f in IMEService/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            case "$base" in
              *arm64-v8a*)   abi="arm64-v8a" ;;
              *armeabi-v7a*) abi="armeabi-v7a" ;;
              *)             abi="universal" ;;
            esac
            out="out/TVRemoteIME-${TAG}-${abi}.apk"
            cp "$f" "$out"
            echo "==> $out"
            ls -lh "$out"
            echo "--- ABI libs in ${abi} package ---"
            unzip -l "$out" | grep -E "lib/[^/]+/" | sort -u || true
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No release APK found, build output:"
            find IMEService/build -name "*.apk" || true
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Produced ${count} APK(s)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVRemoteIME-apk
          path: out/*.apk

      - name: Create Release & Upload APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: TVRemoteIME ${{ github.ref_name }}
          body: |
            ## TVRemoteIME ${{ github.ref_name }}

            ### 📦 下载（按设备 CPU 架构选择）

            | 架构 | 文件 | 说明 |
            |---|---|---|
            | armeabi-v7a | `TVRemoteIME-${{ github.ref_name }}-armeabi-v7a.apk` | 32 位 ARM，含 IJK / 迅雷内核 so，兼容老盒子 |
            | arm64-v8a | `TVRemoteIME-${{ github.ref_name }}-arm64-v8a.apk` | 64 位 ARM，体积最小，播放走 ExoPlayer |
            | universal | `TVRemoteIME-${{ github.ref_name }}-universal.apk` | 双架构通用包，不确定架构时选它 |

            不确定自己设备属于哪种架构，就下载 **universal** 通用包。

            ### 📝 更新说明
            请参考仓库 `released/version.json` 中的完整更新日志。

            ### 🔧 构建信息
            - OS: Ubuntu 24.04
            - JDK: 17 (Temurin)
            - Android Gradle Plugin: 7.4.2
            - Compile / Target SDK: 33
            - Min SDK: 21（兼容 Android 5.0 及以上）
            - 构建时间: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
