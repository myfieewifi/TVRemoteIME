name: Build APK (Multi-ABI)

on:
  push:
    tags:
      - 'v*'           # 推送 v* 标签时自动触发构建并发布 Release
  workflow_dispatch:   # 支持在 Actions 页面手动触发

jobs:
  build:
    name: Build Android APK
    # 锁死 Ubuntu 版本，避免 2026-10-19 自动迁移到 Ubuntu 26 带来的不确定性
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # 升级到 v5，消除 Node.js 20 / setup-java v4 的弃用警告
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: "Build Release APK (all ABIs: armeabi-v7a, arm64-v8a, x86, x86_64)"
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: collect
        run: |
          APK_NAME="TVRemoteIME-${GITHUB_REF_NAME:-debug}.apk"
          APK_RAW=$(find IMEService/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_RAW" ]; then
            echo "::error::Release APK not found, build output:"
            find IMEService/build -name "*.apk" || true
            exit 1
          fi
          APK_OUT="$(dirname "$APK_RAW")/$APK_NAME"
          mv "$APK_RAW" "$APK_OUT"
          echo "apk_path=$APK_OUT" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          ls -lh "$APK_OUT"
          echo "--- ABI contents ---"
          unzip -l "$APK_OUT" | grep -E "lib/[^/]+/" | sort -u

      - name: Create Release & Upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.collect.outputs.apk_path }}
          name: TVRemoteIME ${{ github.ref_name }}
          body: |
            ## TVRemoteIME ${{ github.ref_name }}

            ### 📦 下载
            - **TVRemoteIME-${{ github.ref_name }}.apk**（armeabi-v7a + arm64-v8a 双架构，覆盖市面 99% 电视/盒子）

            ### 📝 更新说明
            请参考 `released/version.json` 中的完整更新日志。

            ### 🔧 构建信息
            - OS: Ubuntu 24.04
            - JDK: 17 (Temurin)
            - Android Gradle Plugin: 7.4.2
            - Compile / Target SDK: 33
            - Min SDK: 21（兼容 Android 5.0 及以上）
            - 构建时间: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
