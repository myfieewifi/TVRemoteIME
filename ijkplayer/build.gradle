apply plugin: 'com.android.library'

android {
    namespace 'com.afap.ijkplayer'
    compileSdkVersion 33
    buildToolsVersion '33.0.2'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // ijkplayer 播放内核 Java 层（0.8.4）改为源码内置（src/main/java/tv/danmaku/...，
    // 取自 bilibili/ijkplayer 官方 k0.8.4 标签）——与 jniLibs 中的 0.8.4 原生 so 严格配套。
    // 此前内置的 0.8.8 jar 与 0.8.4 so JNI 接口错配，IjkMediaPlayer 创建即崩（IJK 内核闪退根因）。
    // JCenter 已关停、各镜像均无 0.8.4 jar，源码内置是最可靠的离线方案。
    // 此处使用 api 而非 implementation：DroidDLNA / IMEService 等下游模块需要在编译期访问该 Java 层。
    // 排除历史遗留的 0.8.8 本地 jar（与 so 不配对，且会与内置源码产生重复类冲突）
    api fileTree(dir: 'libs', include: ['*.jar'], exclude: ['ijkplayer-java-0.8.8.jar'])
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation project(':thunder')
}
