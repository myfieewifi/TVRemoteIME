apply plugin: 'com.android.library'

android {
    namespace 'com.afap.ijkplayer'
    compileSdkVersion 33
    buildToolsVersion '33.0.2'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // ijkplayer 播放内核的 Java 层（原生 so 为 0.8.4，Java 层必须同版本，
    // 否则 JNI 接口错配、IjkMediaPlayer 创建即崩——此前错误内置 0.8.8 jar 导致
    // IJK 内核一播就闪退）。JCenter 已关停，改由根 build.gradle 的阿里云 JCenter
    // 镜像仓库解析。
    // 此处使用 api 而非 implementation：DroidDLNA / IMEService 等下游模块需要在编译期访问该 Java 层。
    api 'tv.danmaku.ijk.media:ijkplayer-java:0.8.4'
    // 排除历史遗留的 0.8.8 本地 jar（与 so 不配对）
    api fileTree(dir: 'libs', include: ['*.jar'], exclude: ['ijkplayer-java-0.8.8.jar'])
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation project(':thunder')
}
