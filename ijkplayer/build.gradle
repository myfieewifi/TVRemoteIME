apply plugin: 'com.android.library'

android {
    compileSdkVersion 33
    buildToolsVersion '33.0.2'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // ijkplayer 播放内核的 Java 层以本地 jar 内置（libs/ijkplayer-java-0.8.8.jar）。
    // 原始坐标 tv.danmaku.ijk.media:ijkplayer-java 托管于 JCenter，而该仓库已于 2021 年关停，
    // 改为本地内置可避免构建时依赖解析失败，离线与 CI 环境均可正常编译。
    // 此处使用 api 而非 implementation：DroidDLNA / IMEService 等下游模块需要在编译期访问该 Java 层。
    api fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation project(':thunder')
}
